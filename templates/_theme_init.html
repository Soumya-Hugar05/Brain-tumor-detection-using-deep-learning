<script>
      /* Apply the saved theme before first paint to avoid a flash. Storage may be unavailable. */
      (function () {
        try {
          var t = localStorage.getItem("neuroinsight-theme");
          if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
        } catch (e) { /* ignore */ }
      })();
    </script>
