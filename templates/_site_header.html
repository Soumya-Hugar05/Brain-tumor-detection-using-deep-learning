<header class="site-header">
      <div class="wrap header-inner">
        <a class="brand" href="{{ url_for('landing') }}" aria-label="NeuroInsight home page">
          <svg class="logo" viewBox="0 0 40 40" aria-hidden="true" focusable="false">
            <rect width="40" height="40" rx="11" class="logo-bg" />
            <path d="M7 21h6l3-8 5 15 3-9 2 2h7" class="logo-line" />
          </svg>
          <span class="brand-text">
            <{{ 'h1' if active == 'analysis' else 'span' }} class="brand-name">NeuroInsight</{{ 'h1' if active == 'analysis' else 'span' }}>
            <span class="subtitle">Brain MRI Analysis Platform</span>
          </span>
        </a>
        <nav class="main-nav" aria-label="Main">
          <a href="{{ url_for('analysis_page') }}"{% if active == 'analysis' %} aria-current="page"{% endif %}>Analysis</a>
          <a href="{{ url_for('reports_page') }}"{% if active == 'reports' %} aria-current="page"{% endif %}>Reports</a>
        </nav>
        <div class="header-actions">
          <span class="badge">Research prototype</span>
          {% if current_user.is_authenticated %}
          <form method="post" action="{{ url_for('auth.logout') }}" class="inline-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
            <button type="submit" class="btn btn-ghost btn-sm" title="Signed in as {{ current_user.full_name }}">Sign out</button>
          </form>
          {% endif %}
          <button id="themeToggle" type="button" class="icon-btn" aria-label="Switch to light theme" title="Switch theme">
            <svg class="icon icon-sun" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            <svg class="icon icon-moon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M21 13a8 8 0 1 1-10-10 6.5 6.5 0 0 0 10 10z"/></svg>
          </button>
        </div>
      </div>
    </header>
